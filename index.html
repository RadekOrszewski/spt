<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprint dependency forecast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --ink:#000000;
  --ink-2:#4A4A4A;
  --ink-3:#8A8A85;
  --paper:#F4F4F1;
  --panel:#FFFFFF;
  --rule:#E8E7E2;
  --rule-2:#D4D3CC;
  --grid:#F0EFEA;
  --signal:#FADD10;
  --signal-soft:#FEF6C0;
  --signal-deep:#C9B000;
  --plot:#FADD10;
  --plot-soft:#FEF6C0;
  --go:#000000;
  --go-soft:#FFFFFF;
  --wait:#000000;
  --wait-soft:#FADD10;
  --block:#000000;
  --block-soft:#FEF6C0;
  --r:14px;
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 8px 26px -14px rgba(0,0,0,.20);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Poppins",system-ui,sans-serif;
  font-size:15px;
  font-weight:400;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px 96px}
h1,h2,h3{font-family:"Poppins",sans-serif;margin:0;letter-spacing:-0.02em}
h1{font-size:38px;font-weight:600;line-height:1.18}
h2{font-size:20px;font-weight:600}
h3{font-size:16px;font-weight:600}
p{margin:0}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.01em}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);
  background:var(--signal);display:inline-block;padding:3px 11px;border-radius:999px}

header{padding:44px 0 30px;margin-bottom:34px}
.brand{display:flex;align-items:center;gap:9px;margin-bottom:20px}
.brand span{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--ink-2)}
.shuriken{width:22px;height:22px;color:var(--signal);flex:none;filter:drop-shadow(0 0 0.4px rgba(0,0,0,.9))}
@media (prefers-reduced-motion:no-preference){
  .brand:hover .shuriken{animation:spin 1.4s cubic-bezier(.5,0,.2,1)}
  @keyframes spin{to{transform:rotate(360deg)}}
}
header h1{max-width:20ch;margin-top:8px}
header .sub{color:var(--ink-2);max-width:64ch;margin-top:16px;font-size:15px;font-weight:300}
header .rule{width:64px;height:5px;background:var(--signal);border-radius:3px;margin-top:26px}

section{margin-bottom:44px}
.sechead{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.sechead h2{display:flex;align-items:center;gap:13px}
.num{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;
  border-radius:50%;background:var(--signal);color:var(--ink);font-size:13px;font-weight:600;flex:none;letter-spacing:0}
.sechead .hint{color:var(--ink-3);font-size:13px;font-weight:300;margin-left:auto}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:20px;padding:26px 28px;box-shadow:var(--shadow)}

.grid-params{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px 24px}
label{display:block}
.lab{font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--ink);margin-bottom:7px;display:flex;gap:6px;align-items:baseline}
.lab em{font-style:normal;color:var(--ink-3);font-size:11.5px;font-weight:400}
input[type=text],input[type=number],select,textarea{
  width:100%;font-family:inherit;font-size:14px;font-weight:400;padding:10px 13px;
  background:#fff;color:var(--ink);border:1px solid var(--rule-2);border-radius:10px;
  transition:border-color .15s ease, box-shadow .15s ease;
}
input:hover,select:hover{border-color:var(--ink-3)}
input:focus,select:focus,textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px var(--signal);outline:none}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px;box-shadow:0 0 0 5px var(--signal)}

button{
  font-family:inherit;font-size:13.5px;font-weight:500;padding:9px 18px;cursor:pointer;
  background:#fff;color:var(--ink);border:1px solid var(--rule-2);border-radius:999px;
  transition:background .15s ease,border-color .15s ease,color .15s ease,transform .1s ease;
}
button:hover{background:var(--signal);border-color:var(--ink);color:var(--ink)}
button:active{transform:translateY(1px)}
button.primary{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600;padding:11px 26px}
button.primary:hover{background:var(--signal);border-color:var(--ink);color:var(--ink)}
button.ghost{border-color:var(--rule);color:var(--ink-2)}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stat{background:var(--paper);border-left:4px solid var(--signal);border-radius:0 12px 12px 0;padding:12px 16px;min-width:150px}
.stat .v{display:block;font-size:26px;font-weight:600;line-height:1.2;letter-spacing:-0.02em}
.stat .k{font-size:12px;font-weight:300;color:var(--ink-2);line-height:1.4}

table{width:100%;border-collapse:separate;border-spacing:0}
th{
  font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;
  color:var(--ink-3);text-align:left;padding:0 8px 10px;
}
td{padding:5px 8px;border-top:1px solid var(--grid);vertical-align:middle}
td input,td select{padding:8px 11px;font-size:13.5px;border-radius:9px;border-color:var(--rule)}
tr.warn td{background:var(--signal-soft)}
.ord{color:var(--ink-3);font-size:12px;width:30px;font-weight:500}
.del{border:none;background:none;color:var(--ink-3);padding:6px 9px;line-height:1;font-size:17px;border-radius:50%}
.del:hover{background:var(--signal);color:var(--ink);border:none}

.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;align-items:start}
.col{background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:20px;box-shadow:var(--shadow);overflow:hidden;position:relative}
.col::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;background:var(--signal)}
.col::after{content:"";position:absolute;top:0;left:0;height:6px;width:var(--conf,0%);background:var(--ink)}
.col.beyond{background:transparent;border-style:dashed;box-shadow:none}
.col.beyond::before,.col.beyond::after{display:none}
.col h3{letter-spacing:-0.01em}

.meter{height:10px;background:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14);border-radius:999px;
  position:relative;margin:12px 0 6px;overflow:visible}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--signal);border-radius:999px;display:block;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.28)}
.meter b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:2px}
.meterlab{display:flex;justify-content:space-between;font-size:11px;font-weight:500;color:var(--ink-2);margin-bottom:16px}

.item{background:var(--paper);border-radius:12px;padding:11px 13px;margin-bottom:9px;
  display:grid;grid-template-columns:1fr auto;gap:3px 8px;align-items:baseline}
.item .k{font-size:13.5px;font-weight:600;letter-spacing:.01em}
.item .s{font-size:12px;font-weight:300;color:var(--ink-2);grid-column:1/-1;line-height:1.45}
.pts{font-size:12px;font-weight:500;color:var(--ink-3)}
.tag{display:inline-block;font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 9px;border-radius:999px;border:1px solid}
.tag.wait{color:var(--ink);border-color:var(--ink);background:var(--signal)}
.tag.ready{color:var(--ink);border-color:var(--ink);background:#fff}
.tag.block{color:var(--signal);border-color:var(--ink);background:var(--ink)}

.strip{display:flex;gap:3px;grid-column:1/-1;margin-top:9px}
.strip span{flex:1;height:18px;background:#fff;border-radius:5px;position:relative;overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.16)}
.strip span i{position:absolute;left:0;bottom:0;right:0;background:var(--signal);display:block}
.strip span u{position:absolute;inset:0;font-size:10px;font-weight:600;text-decoration:none;
  display:flex;align-items:center;justify-content:center;color:var(--ink)}

.lane{margin-top:16px}
.lane h4{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:0 0 9px}
.req{background:var(--signal);border:1px solid var(--ink);border-radius:10px;padding:9px 11px;margin-bottom:8px}
.req .k{display:block;font-size:13px;font-weight:600;line-height:1.35}
.req .d{display:block;font-size:11.5px;font-weight:400;color:var(--ink)}
.pull{background:#fff;border:1px solid var(--ink-3);border-radius:10px;padding:9px 11px;margin-bottom:8px;
  display:flex;justify-content:space-between;align-items:center;gap:8px}
.pull .k{font-size:13px;font-weight:600}
.bucket{background:var(--ink);color:#fff;border-radius:16px;padding:20px 24px;margin-top:16px}
.bucket h3{color:var(--signal);margin-bottom:6px}
.bucket .row-i{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-top:1px solid rgba(255,255,255,.18);font-size:13px}
.bucket .row-i:first-of-type{border-top:none}
.bucket .why{color:var(--signal);font-weight:500}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:20px}
.handoff{background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:22px 24px;margin-top:16px;box-shadow:var(--shadow)}
.hgrid{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:10px 16px;align-items:center}
.hlabel .k{display:block;font-size:13px;font-weight:600;line-height:1.3}
.hlabel .t{display:block;font-size:11.5px;color:var(--ink-2)}
.hcells{display:grid;gap:5px}
.hcell{height:28px;border-radius:7px;background:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);
  display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:600;color:var(--ink-3)}
.hcell.wait{background:var(--signal);box-shadow:inset 0 0 0 1px rgba(0,0,0,.28);color:var(--ink)}
.hcell.ask{background:var(--ink);color:var(--signal);box-shadow:none}
.hcell.work{background:#fff;box-shadow:inset 0 0 0 2px var(--ink);color:var(--ink)}
.hhead{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);text-align:center;font-weight:600}
.hsum{font-size:11.5px;color:var(--ink-2);margin-top:3px}
.reserve{border:1px dashed var(--ink);border-radius:12px;padding:11px 13px;margin-top:14px;background:var(--signal-soft);
  font-size:12px;font-weight:300;color:var(--ink-2);line-height:1.5}
.reserve strong{font-weight:600;color:var(--ink)}
.empty{color:var(--ink-3);font-size:13px;font-weight:300;padding:12px 0}

.legend{display:flex;gap:20px;flex-wrap:wrap;font-size:12px;font-weight:300;color:var(--ink-2);margin-top:20px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:4px;border:1px solid;vertical-align:-1px;margin-right:6px}
.note{font-size:14px;font-weight:300;color:var(--ink-2);max-width:80ch;line-height:1.7}
.note strong{font-weight:600;color:var(--ink)}

.drop{border:2px dashed var(--rule-2);border-radius:16px;padding:22px;text-align:center;
  color:var(--ink-2);font-size:13.5px;font-weight:300;background:var(--paper);transition:all .15s ease}
.drop strong{font-weight:600;color:var(--ink)}
.drop.over{border-color:var(--ink);background:var(--signal-soft)}
.msg{font-size:13px;padding:11px 15px;margin-top:12px;border-radius:10px;background:var(--signal-soft);
  border-left:4px solid var(--signal);color:var(--ink);font-weight:400}
.msg.bad{background:var(--ink);border-left-color:var(--signal);color:var(--signal)}
details summary{cursor:pointer;font-size:13px;font-weight:500;color:var(--ink);padding:8px 0;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"+ ";font-weight:600}
details[open] summary::before{content:"– "}
.tblwrap{overflow-x:auto}
.foot{font-size:12px;font-weight:300;color:var(--ink-3)}

@media (max-width:640px){
  .wrap{padding:0 16px 60px}
  h1{font-size:28px}
  .panel{padding:20px;border-radius:16px}
  th:nth-child(3),td:nth-child(3){display:none}
}
@media (prefers-reduced-motion:no-preference){
  .meter i,.strip span i{transition:width .3s cubic-bezier(.4,0,.2,1),height .3s cubic-bezier(.4,0,.2,1)}
}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}
.brand{margin-bottom:0}
.langswitch{display:inline-flex;border:1px solid var(--ink);border-radius:999px;overflow:hidden}
.langswitch button{border:none;border-radius:0;padding:5px 14px;font-size:12px;font-weight:600;letter-spacing:.06em;background:#fff;color:var(--ink)}
.langswitch button + button{border-left:1px solid var(--ink)}
.langswitch button:hover{background:var(--signal-soft)}
.langswitch button[aria-pressed="true"]{background:var(--signal);color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="topbar">
    <div class="brand">
      <svg class="shuriken" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M12 1.4l2.6 7.99L22.6 12l-8 2.61L12 22.6l-2.6-8.0L1.4 12l8-2.61z"/>
        <circle cx="12" cy="12" r="2.1" fill="var(--ink)"/>
      </svg>
      <span data-i18n="brand">Lean Agile Ninja</span>
    </div>
    <div class="langswitch" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="pl" aria-pressed="false">PL</button>
    </div>
  </div>
  <p class="eyebrow" data-i18n="hdr.eyebrow">Flow forecasting</p>
  <h1 data-i18n="hdr.title">Cross-team dependency forecast</h1>
  <div class="rule"></div>
  <p class="sub" data-i18n="hdr.sub"></p>
</header>

<section>
  <div class="sechead">
    <h2><span class="num">1</span><span data-i18n="s1.title">Delivery history</span></h2>
    <span class="hint" data-i18n="s1.hint"></span>
  </div>
  <div class="panel">
    <div class="grid-params">
      <label style="grid-column:1/-1">
        <span class="lab"><span data-i18n="s1.completed"></span> <em data-i18n="s1.completed.em"></em></span>
        <textarea id="p-throughput" rows="8" spellcheck="false">S-14: 5, 3, 8, 3, 2
S-15: 3, 3, 5, 5, 2
S-16: 8, 5, 3, 5, 3, 1
S-17: 5, 8, 3, 2
S-18: 3, 5, 5, 3, 3, 2
S-19: 8, 3, 3, 3
S-20: 2, 3, 5, 5, 3, 2
S-21: 5, 5, 8, 3
S-22: 3, 2, 3, 5, 5, 3
S-23: 8, 5, 3</textarea>
      </label>
      <label>
        <span class="lab"><span data-i18n="s1.sprintlen"></span> <em data-i18n="s1.sprintlen.em"></em></span>
        <input type="number" id="p-sprintlen" value="10" min="1" max="60">
      </label>
      <label>
        <span class="lab"><span data-i18n="s1.late"></span> <em data-i18n="s1.late.em"></em></span>
        <input type="number" id="p-late" value="34" min="0" max="100" step="1">
      </label>
      <label>
        <span class="lab"><span data-i18n="s1.horizon"></span></span>
        <input type="number" id="p-horizon" value="3" min="1" max="6">
      </label>
      <label>
        <span class="lab"><span data-i18n="s1.runs"></span></span>
        <input type="number" id="p-runs" value="3000" min="200" max="20000" step="100">
      </label>
      <label>
        <span class="lab"><span data-i18n="s1.basis"></span> <em data-i18n="s1.basis.em"></em></span>
        <select id="p-basis">
          <option value="both" selected data-i18n="s1.basis.both"></option>
          <option value="points" data-i18n="s1.basis.points"></option>
          <option value="items" data-i18n="s1.basis.items"></option>
        </select>
      </label>
      <label>
        <span class="lab"><span data-i18n="s1.backfill"></span> <em data-i18n="s1.backfill.em"></em></span>
        <select id="p-backfill">
          <option value="1" selected data-i18n="s1.backfill.yes"></option>
          <option value="0" data-i18n="s1.backfill.no"></option>
        </select>
      </label>
    </div>
    <div class="row" style="margin-top:22px;gap:12px">
      <div class="stat"><span class="v mono" id="s-items">—</span><span class="k" data-i18n="s1.stat.items"></span></div>
      <div class="stat"><span class="v mono" id="s-pts">—</span><span class="k" data-i18n="s1.stat.pts"></span></div>
      <div class="stat"><span class="v mono" id="s-p85">—</span><span class="k" data-i18n="s1.stat.p85"></span></div>
      <div class="stat"><span class="v mono" id="s-size">—</span><span class="k" data-i18n="s1.stat.size"></span></div>
      <div class="stat"><span class="v mono" id="s-deps">—</span><span class="k" data-i18n="s1.stat.deps"></span></div>
    </div>
    <p class="note" style="margin-top:18px;font-size:13px" data-i18n="s1.note"></p>
    <p class="note" style="margin-top:10px;font-size:13px" data-i18n="s1.note2"></p>
  </div>
</section>

<section>
  <div class="sechead">
    <h2><span class="num">2</span><span data-i18n="s2.title">Teams you depend on</span></h2>
    <span class="hint" data-i18n="s2.hint"></span>
  </div>
  <div class="panel">
    <div class="tblwrap">
      <table>
        <thead>
          <tr>
            <th style="width:32%" data-i18n="s2.th.team"></th>
            <th style="width:26%" data-i18n="s2.th.p85"></th>
            <th style="width:20%" data-i18n="s2.th.absorb"></th>
            <th data-i18n="s2.th.load"></th>
            <th></th>
          </tr>
        </thead>
        <tbody id="teambody"></tbody>
      </table>
    </div>
    <div class="row" style="margin-top:16px">
      <button id="btn-addteam" data-i18n="s2.add"></button>
    </div>
    <p class="note" style="margin-top:16px;font-size:13px" data-i18n="s2.note"></p>
  </div>
</section>

<section>
  <div class="sechead">
    <h2><span class="num">3</span><span data-i18n="s3.title">Backlog</span></h2>
    <span class="hint" data-i18n="s3.hint"></span>
  </div>
  <div class="panel">
    <div class="tblwrap">
      <table id="tbl">
        <thead>
          <tr>
            <th></th>
            <th style="width:14%" data-i18n="s3.th.key"></th>
            <th data-i18n="s3.th.summary"></th>
            <th style="width:9%" data-i18n="s3.th.points"></th>
            <th style="width:18%" data-i18n="s3.th.team"></th>
            <th style="width:17%" data-i18n="s3.th.state"></th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="row" style="margin-top:16px">
      <button id="btn-add" data-i18n="s3.add"></button>
      <button id="btn-demo" class="ghost" data-i18n="s3.demo"></button>
      <button id="btn-clear" class="ghost" data-i18n="s3.clear"></button>
      <button id="btn-tmpl" class="ghost" data-i18n="s3.tmpl"></button>
      <button id="btn-savejson" class="ghost" data-i18n="s3.savejson"></button>
      <button id="btn-loadjson" class="ghost" data-i18n="s3.loadjson"></button>
    </div>

    <div style="margin-top:18px">
      <div class="drop" id="drop">
        <strong data-i18n="s3.drop"></strong><br>
        <span data-i18n="s3.dropor"></span>
        <button id="btn-file" style="padding:5px 14px;margin-left:4px" data-i18n="s3.choose"></button>
        <div style="font-size:12px;color:var(--ink-3);margin-top:10px" data-i18n="s3.cols"></div>
      </div>
      <input type="file" id="file" accept=".xlsx,.xls,.csv" hidden>
      <input type="file" id="jsonfile" accept=".json" hidden>
      <details style="margin-top:12px">
        <summary data-i18n="s3.details"></summary>
        <p class="note" style="margin-top:6px;font-size:13px" data-i18n="s3.details.body"></p>
      </details>
      <div id="import-msg"></div>
    </div>
  </div>
</section>

<section>
  <div class="sechead">
    <h2><span class="num">4</span><span data-i18n="s4.title">Forecast</span></h2>
    <span class="hint" id="run-hint"></span>
  </div>
  <div class="row" style="margin-bottom:18px">
    <button class="primary" id="btn-run" data-i18n="s4.run"></button>

var LANG = (function(){
  var q = /[?&]lang=(en|pl)/.exec(location.search);
  if (q) return q[1];
  return (navigator.language || "en").toLowerCase().indexOf("pl") === 0 ? "pl" : "en";
})();

function t(key, vars){
  var s = STR[LANG][key];
  if (s === undefined) s = STR.en[key];
  if (s === undefined) return key;
  if (vars){
    s = String(s).replace(/\{(\w+)\}/g, function(m, k){
      return vars[k] === undefined ? m : vars[k];
    });
  }
  return s;
}
function locale(){ return STR[LANG].locale; }

/* Polish agrees the noun with the number: 1 sprint, 2 sprinty, 5 sprintów */
function pluralIndex(n){
  n = Math.abs(Math.round(n));
  if (LANG === "pl"){
    if (n === 1) return 0;
    var d = n % 10, h2 = n % 100;
    return (d >= 2 && d <= 4 && !(h2 >= 12 && h2 <= 14)) ? 1 : 2;
  }
  return n === 1 ? 0 : 1;
}
function nw(n, key){
  var forms = STR[LANG][key] || STR.en[key] || [""];
  return forms[Math.min(pluralIndex(n), forms.length - 1)];
}
function fmtN(x){ return Number(x).toLocaleString(locale()); }

function applyLang(){
  document.documentElement.lang = STR[LANG].htmlLang;
  var nodes = document.querySelectorAll("[data-i18n]");
  for (var i = 0; i < nodes.length; i++){
    nodes[i].innerHTML = t(nodes[i].getAttribute("data-i18n"));
  }
  var phs = document.querySelectorAll("[data-i18n-ph]");
  for (var j = 0; j < phs.length; j++){
    phs[j].setAttribute("placeholder", t(phs[j].getAttribute("data-i18n-ph")));
  }
  var btns = document.querySelectorAll("[data-lang]");
  for (var k = 0; k < btns.length; k++){
    btns[k].setAttribute("aria-pressed", btns[k].getAttribute("data-lang") === LANG ? "true" : "false");
  }
}

function setLang(code){
  if (code === LANG) return;
  LANG = code;
  applyLang();
  renderTeams();
  renderTable();
  runForecast();
}

var P85_FACTOR = 1.8971;   /* -ln(0.15) : converts an exponential mean to its 85th percentile */

var teams = [];
var items = [];
var lastForecast = null;

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
function pct(x){ return Math.round(x * 100) + "%"; }
function r1(x){ return Math.round(x * 10) / 10; }

/* ---------- statistics ---------- */

function percentile(arr, p){
  if (!arr.length) return 0;
  var s = arr.slice().sort(function(a,b){ return a-b; });
  var idx = (s.length - 1) * p;
  var lo = Math.floor(idx), hi = Math.ceil(idx);
  return lo === hi ? s[lo] : s[lo] + (s[hi] - s[lo]) * (idx - lo);
}
function sampleWait(mean){
  if (mean <= 0) return 0;
  var u = Math.random();
  if (u > 0.999999) u = 0.999999;
  return -mean * Math.log(1 - u);
}

/* ---------- delivery history ---------- */

function parseHistory(text){
  var out = [];
  String(text).split(/\n+/).forEach(function(line){
    if (!line.trim()) return;
    var label = "", body = line;
    var colon = line.indexOf(":");
    if (colon > -1){ label = line.slice(0, colon).trim(); body = line.slice(colon + 1); }
    var sizes = body.split(/[,;\s]+/).map(parseFloat).filter(function(n){ return isFinite(n) && n > 0; });
    if (!sizes.length) return;
    out.push({
      label: label || ("S-" + (out.length + 1)),
      sizes: sizes,
      count: sizes.length,
      points: sizes.reduce(function(a,b){ return a + b; }, 0)
    });
  });
  return out;
}

/* ---------- parameters ---------- */

function readParams(){
  var hist = parseHistory($("p-throughput").value);
  if (!hist.length) hist = [{ label:"fallback", sizes:[3,3,3,3,3], count:5, points:15 }];
  var sprintLen = Math.max(1, +$("p-sprintlen").value || 10);
  return {
    history: hist,
    sprintLen: sprintLen,
    pLate: Math.min(1, Math.max(0, (+$("p-late").value || 0) / 100)),
    usePoints: $("p-basis").value !== "items",
    useItems: $("p-basis").value !== "points",
    backfill: $("p-backfill").value === "1",
    horizon: Math.min(6, Math.max(1, Math.round(+$("p-horizon").value || 3))),
    runs: Math.min(20000, Math.max(200, Math.round(+$("p-runs").value || 3000)))
  };
}

/* teams carry a P85 response time; the simulation needs the matching exponential mean */
function teamMean(t){ return Math.max(0, (+t.p85 || 0)) / P85_FACTOR; }

function teamIndex(name){
  var n = String(name || "").trim().toLowerCase();
  for (var i = 0; i < teams.length; i++){ if (teams[i].name.toLowerCase() === n) return i; }
  return -1;
}
function ensureTeam(name, p85){
  var i = teamIndex(name);
  if (i >= 0) return i;
  teams.push({ name: String(name).trim() || "Unassigned", p85: p85 == null ? 10 : p85 });
  return teams.length - 1;
}

/* which team a surprise dependency lands on: in proportion to the labelled backlog */
function surpriseWeights(){
  var w = teams.map(function(){ return 0; });
  var total = 0;
  items.forEach(function(it){
    if (it.state === "waiting"){
      var i = teamIndex(it.team);
      if (i >= 0){ w[i] += 1; total += 1; }
    }
  });
  if (!total) return teams.map(function(){ return 1 / (teams.length || 1); });
  return w.map(function(v){ return v / total; });
}
function pickTeam(weights){
  var u = Math.random(), acc = 0;
  for (var i = 0; i < weights.length; i++){ acc += weights[i]; if (u <= acc) return i; }
  return weights.length - 1;
}
function expectedWait(){
  var w = surpriseWeights(), sum = 0;
  for (var i = 0; i < teams.length; i++) sum += w[i] * teamMean(teams[i]);
  return sum;
}

/* ---------- simulation ---------- */

function oneRun(p, weights, maxS){
  var n = items.length;
  var pts = items.map(function(it){ return +it.points || 0; });
  var done = new Array(n).fill(-1);
  var readyFrom = new Array(n).fill(0);
  var settled = new Array(n).fill(false);
  var blamed = new Array(n).fill(-1);
  var remaining = n;

  for (var s = 0; s < maxS && remaining > 0; s++){
    var sprint = p.history[Math.floor(Math.random() * p.history.length)];
    var capPts = sprint.points, capItems = sprint.count;

    for (var i = 0; i < n; i++){
      if (done[i] >= 0 || readyFrom[i] > s) continue;
      if (p.useItems && capItems <= 0) break;
      if (p.usePoints && pts[i] > capPts){
        if (p.backfill) continue;              /* pull the next item that fits */
        break;                                 /* or stop the sprint here */
      }

      if (!settled[i]){
        settled[i] = true;
        var ti = -1;
        if (items[i].state === "waiting"){
          ti = teamIndex(items[i].team);
          if (ti < 0 && teams.length) ti = pickTeam(weights);
        } else if (items[i].state === "none" && teams.length && Math.random() < p.pLate){
          ti = pickTeam(weights);              /* the dependency nobody had labelled */
        }
        if (ti >= 0){
          var wait = sampleWait(teamMean(teams[ti]));
          var q = wait / p.sprintLen;
          var push = Math.floor(q);
          /* the wait starts at a random point in the sprint, so a sub-sprint wait
             sometimes still lands inside it and sometimes tips over the edge */
          if (Math.random() < (q - push)) push += 1;
          blamed[i] = ti;
          if (push > 0){
            readyFrom[i] = s + push;
            continue;                        /* capacity freed for the next item */
          }
        }
      }
      if (p.usePoints) capPts -= pts[i];
      capItems -= 1;
      done[i] = s;
      remaining--;
    }
  }
  return { done: done, blamed: blamed };
}

function runSim(p){
  var n = items.length;
  if (!n) return null;
  var weights = surpriseWeights();
  var maxS = p.horizon + 5;
  var counts = items.map(function(){ return new Array(maxS).fill(0); });
  var surprises = teams.map(function(){ return 0; });
  var runs = [];

  for (var r = 0; r < p.runs; r++){
    var res = oneRun(p, weights, maxS);
    if (r < 4000) runs.push(res.done);
    for (var j = 0; j < n; j++){
      if (res.done[j] >= 0) counts[j][res.done[j]]++;
      if (items[j].state === "none" && res.blamed[j] >= 0) surprises[res.blamed[j]] += (+items[j].points || 0);
    }
  }

  var cum = counts.map(function(row){
    var out = [], acc = 0;
    for (var s = 0; s < maxS; s++){ acc += row[s]; out.push(acc / p.runs); }
    return out;
  });
  var placement = cum.map(function(c){
    for (var s = 0; s < c.length; s++){ if (c[s] >= 0.5) return s; }
    return -1;
  });
  var cols = [];
  for (var s2 = 0; s2 < p.horizon; s2++){
    cols.push(items.map(function(_, i){ return i; }).filter(function(i){ return placement[i] === s2; }));
  }
  var joint = cols.map(function(_, c){
    var scope = [];
    for (var k = 0; k <= c; k++) scope = scope.concat(cols[k]);
    if (!scope.length) return 1;
    var ok = 0;
    for (var r2 = 0; r2 < runs.length; r2++){
      var d = runs[r2], all = true;
      for (var q = 0; q < scope.length; q++){
        if (d[scope[q]] < 0 || d[scope[q]] > c){ all = false; break; }
      }
      if (all) ok++;
    }
    return runs.length ? ok / runs.length : 0;
  });

  return {
    cum: cum, placement: placement, cols: cols, joint: joint,
    surprisePts: surprises.map(function(v){ return v / p.runs; })
  };
}

/* ---------- what to start, what to raise ---------- */

function toISO(d){
  return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
}
function parseISO(s){
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || ""));
  if (!m) return null;
  return new Date(+m[1], +m[2] - 1, +m[3]);
}
function isWorkday(d){ var w = d.getDay(); return w !== 0 && w !== 6; }
function workingAdd(date, n){
  var d = new Date(date.getTime());
  var step = n >= 0 ? 1 : -1, left = Math.abs(Math.round(n));
  while (left > 0){ d.setDate(d.getDate() + step); if (isWorkday(d)) left--; }
  return d;
}
function workingBetween(a, b){
  var sign = b >= a ? 1 : -1;
  var from = sign > 0 ? new Date(a.getTime()) : new Date(b.getTime());
  var to   = sign > 0 ? b : a;
  var n = 0;
  while (from < to){ from.setDate(from.getDate() + 1); if (isWorkday(from)) n++; }
  return n * sign;
}
function fmtDate(d){
  return d.toLocaleDateString(locale(), { day: "numeric", month: "short" });
}
function todayMidnight(){
  var d = new Date(); d.setHours(0,0,0,0); return d;
}

/* the wait a team clears within, at the chosen confidence.
   at 85% this returns exactly the P85 that was entered. */
function waitAtConfidence(t, conf){
  return teamMean(t) * (-Math.log(1 - conf));
}

function readPlanInputs(){
  var conf = Math.min(0.99, Math.max(0.5, (+$("pl-conf").value || 85) / 100));
  var start = parseISO($("pl-start").value) || todayMidnight();
  return {
    conf: conf,
    mode: $("pl-mode").value,
    sprints: Math.max(1, Math.round(+$("pl-sprints").value || 3)),
    date: parseISO($("pl-date").value),
    start: start
  };
}

function buildPlan(){
  var p = readParams();
  var pl = readPlanInputs();
  var sprintStart = function(s){ return workingAdd(pl.start, (s - 1) * p.sprintLen); };

  var K = pl.sprints;
  if (pl.mode === "date" && pl.date){
    var days = workingBetween(pl.start, pl.date);
    K = Math.max(1, Math.floor(days / p.sprintLen));
  }

  /* capacity at the confidence target: the level reached in conf of past sprints */
  var ptsHist = p.history.map(function(s){ return s.points; });
  var cntHist = p.history.map(function(s){ return s.count; });
  var capPts = percentile(ptsHist, 1 - pl.conf);
  var capItems = Math.max(1, Math.floor(percentile(cntHist, 1 - pl.conf)));

  /* phase 1 — the earliest sprint each item could possibly be worked in,
     assuming every outstanding request goes out today. rounding up is the
     planning-safe read: you can rely on the answer being in hand by then. */
  var wait = new Array(items.length).fill(0);
  var earliest = new Array(items.length).fill(1);
  items.forEach(function(it, i){
    if (it.state !== "waiting") return;
    var ti = teamIndex(it.team);
    wait[i] = ti >= 0 ? waitAtConfidence(teams[ti], pl.conf) : 0;
    earliest[i] = 1 + Math.ceil(wait[i] / p.sprintLen);
  });

  /* phase 2 — fill sprints in priority order, honouring both capacity and availability */
  var work = new Array(items.length).fill(0);
  var queue = items.map(function(_, i){ return i; });
  var s = 1;
  while (queue.length && s < 200){
    var leftPts = capPts, leftItems = capItems, placed = false;
    for (var k = 0; k < queue.length; ){
      var i = queue[k];
      var pts = +items[i].points || 0;
      var available = earliest[i] <= s;
      var fitsPts = !p.usePoints || pts <= leftPts + 1e-9;
      var fitsItems = !p.useItems || leftItems > 0;
      if (available && fitsPts && fitsItems){
        work[i] = s;
        if (p.usePoints) leftPts -= pts;
        leftItems -= 1;
        queue.splice(k, 1);
        placed = true;
        continue;                      /* same index now holds the next item */
      }
      if (!p.backfill && available) break;   /* strict priority: stop the sprint here */
      k++;
    }
    /* an item larger than a whole sprint would otherwise loop forever */
    if (!placed && queue.length && earliest[queue[0]] <= s){
      work[queue[0]] = s;
      queue.shift();
    }
    s++;
  }

  var now = todayMidnight();
  var cols = [];
  for (var c = 1; c <= K; c++) cols.push({ sprint: c, start: sprintStart(c), pull: [], raise: [] });
  var missed = [];

  items.forEach(function(it, idx){
    var ws = work[idx];
    var entry = { i: idx, team: "", wait: wait[idx], raiseBy: null, sprint: ws, urgent: false };
    if (it.state === "waiting"){
      entry.team = it.team || "unassigned";
      entry.raiseBy = workingAdd(sprintStart(ws), -Math.ceil(wait[idx]));
      entry.urgent = entry.raiseBy <= now;
    }
    if (ws > K || ws === 0){
      entry.reason = (earliest[idx] > K) ? "dependency" : "capacity";
      missed.push(entry);
      return;
    }
    if (entry.team){
      var r = 1 + Math.floor(workingBetween(pl.start, entry.raiseBy) / p.sprintLen);
      if (r < 1) r = 1;
      if (r > ws) r = ws;
      entry.raiseSprint = r;
      cols[r - 1].raise.push(entry);
    }
    cols[ws - 1].pull.push(entry);
  });

  return { cols: cols, missed: missed, K: K, capPts: capPts, capItems: capItems,
           targetDate: sprintStart(K + 1), conf: pl.conf, sprintLen: p.sprintLen };
}

function updateStats(){
  var p = readParams();
  var counts = p.history.map(function(s){ return s.count; });
  var pts = p.history.map(function(s){ return s.points; });
  var sizes = [];
  p.history.forEach(function(s){ sizes = sizes.concat(s.sizes); });
  $("s-items").textContent = fmtN(r1(percentile(counts, 0.5)));
  $("s-pts").textContent = fmtN(r1(percentile(pts, 0.5)));
  $("s-p85").textContent = fmtN(r1(percentile(pts, 0.15)));
  $("s-size").textContent = fmtN(r1(percentile(sizes, 0.5)));
  $("s-deps").textContent = items.filter(function(i){ return i.state === "waiting"; }).length + " / " + items.length;
}

/* ---------- board ---------- */

function renderBoard(f, p){
  var board = $("board");
  board.innerHTML = "";
  if (!f){
    board.innerHTML = '<p class="empty">' + t("s4.empty") + '</p>';
    return;
  }
  var ptsHist = p.history.map(function(s){ return s.points; });
  var p85 = percentile(ptsHist, 0.15);
  var scaleMax = Math.max(percentile(ptsHist, 0.5), p85, 1) * 1.35;
  var eWait = expectedWait();

  for (var s = 0; s < p.horizon; s++){
    var col = f.cols[s];
    var pts = col.reduce(function(a, i){ return a + (+items[i].points || 0); }, 0);
    var unlabelled = col.filter(function(i){ return items[i].state === "none"; })
                        .reduce(function(a, i){ return a + (+items[i].points || 0); }, 0);
    var reserve = unlabelled * p.pLate * (eWait / p.sprintLen);

    var d = document.createElement("div");
    d.className = "col";
    d.style.setProperty("--conf", Math.round(f.joint[s] * 100) + "%");
    var html =
      '<h3>' + t("sprintN", { n: s + 1 }) + '</h3>' +
      '<p class="pts">' + t("s4.conf", { p: pct(f.joint[s]) }) + '</p>' +
      '<div class="meter">' +
        '<i style="width:' + Math.min(100, pts / scaleMax * 100) + '%"></i>' +
        '<b style="left:' + Math.min(100, p85 / scaleMax * 100) + '%"></b>' +
      '</div>' +
      '<div class="meterlab"><span>' + t("s4.meter", { pts: fmtN(r1(pts)), n: col.length }) +
      '</span><span>P85 ' + fmtN(r1(p85)) + '</span></div>';

    if (!col.length){
      html += '<p class="empty">' + t("s4.nothing") + '</p>';
    } else {
      col.forEach(function(i){ html += itemHtml(i, f, p); });
    }
    html += '<div class="reserve">' + t("s4.reserve", { pts: fmtN(r1(reserve)) }) + '</div>';
    d.innerHTML = html;
    board.appendChild(d);
  }

  var beyond = [];
  for (var i2 = 0; i2 < items.length; i2++){
    if (f.placement[i2] < 0 || f.placement[i2] >= p.horizon) beyond.push(i2);
  }
  if (beyond.length){
    var b = document.createElement("div");
    b.className = "col beyond";
    var bh = '<h3>' + t("s4.beyond") + '</h3><p class="pts">' + t("s4.beyond.sub", { n: p.horizon, w: nw(p.horizon, "f.sprint") }) +
             '</p><div style="height:14px"></div>';
    beyond.forEach(function(i){ bh += itemHtml(i, f, p); });
    b.innerHTML = bh;
    board.appendChild(b);
  }
}

function itemHtml(i, f, p){
  var it = items[i];
  var badge = "";
  if (it.state === "waiting"){
    var ti = teamIndex(it.team);
    var over = ti >= 0 && (+teams[ti].p85 || 0) > p.sprintLen;
    badge = '<span class="tag ' + (over ? "block" : "wait") + '">' + esc(it.team || t("s4.unassigned")) + '</span>';
  } else if (it.state === "ready"){
    badge = '<span class="tag ready">' + esc(it.team || "dep") + ' ' + t("s4.depready") + '</span>';
  }
  var strip = '<div class="strip">';
  for (var s = 0; s < Math.min(3, p.horizon); s++){
    var v = f.cum[i][s] || 0;
    strip += '<span title="' + t("s4.tip", { p: pct(v), n: s + 1 }) + '">' +
             '<i style="height:' + Math.round(v * 100) + '%"></i>' +
             '<u>' + Math.round(v * 100) + '</u></span>';
  }
  strip += '</div>';
  return '<div class="item">' +
    '<span class="k">' + esc(it.key || t("nokey")) + '</span>' +
    '<span>' + badge + ' <span class="pts">' + (+it.points || 0) + ' ' + t("pt") + '</span></span>' +
    (it.summary ? '<span class="s">' + esc(it.summary) + '</span>' : '') +
    strip +
  '</div>';
}

function renderTeamLoad(f){
  var host = $("teamload");

  }
  var rows = teams.map(function(tm, i){
    var known = items.filter(function(it){ return it.state === "waiting" && teamIndex(it.team) === i; })
                     .reduce(function(a, b){ return a + (+b.points || 0); }, 0);

    return { name: tm.name || "—", p85: +tm.p85 || 0, known: known, surprise: surprise, total: known + surprise };
  });

  rows.sort(function(a, b){ return b.total - a.total; }).forEach(function(r){
    html +=
      '<div style="display:grid;grid-template-columns:150px minmax(0,1fr) 200px;gap:14px;align-items:center;margin-bottom:11px">' +
        '<span style="font-size:13.5px;font-weight:600">' + esc(r.name) + '</span>' +

        '</span>' +
        '<span class="pts">' + t("s6.row", { known: fmtN(r1(r.known)), surprise: fmtN(r1(r.surprise)), p85: fmtN(r1(r.p85)) }) + '</span>' +
      '</div>';
  });
  html += '<div class="legend" style="margin-top:16px">' +
          '<span><i style="border-color:var(--ink);background:var(--ink)"></i>' + t("s6.lg.known") + '</span>' +
          '<span><i style="border-color:var(--ink);background:var(--signal)"></i>' + t("s6.lg.late") + '</span></div>';
  host.innerHTML = html;

function runForecast(){
  var p = readParams();
  updateStats();
  if (!items.length){
    lastForecast = null;
    renderBoard(null, p); renderTeamLoad(null); renderPlan();
    return;
  }
  var f = runSim(p);
  lastForecast = { f: f, p: p };
  renderBoard(f, p);
  renderTeamLoad(f);
  renderPlan();
  $("run-hint").textContent = t("s4.runs", { runs: fmtN(p.runs), w: nw(p.runs, "f.run"), n: p.history.length });
}

/* ---------- plan view ---------- */

function renderPlan(){
  var host = $("plan");
  var lateHost = $("plan-late");
  var sum = $("plan-summary");
  if (!items.length){
    host.innerHTML = '<p class="empty">' + t("s5.empty") + '</p>';
    lateHost.innerHTML = ""; sum.innerHTML = ""; $("plan-handoff").innerHTML = "";
    $("plan-hint").textContent = "";
    return;
  }
  var pn = buildPlan();
  var totalRaise = pn.cols.reduce(function(a, c){ return a + c.raise.length; }, 0);
  var urgent = pn.cols.reduce(function(a, c){
    return a + c.raise.filter(function(e){ return e.urgent; }).length; }, 0);
  var inScope = pn.cols.reduce(function(a, c){ return a + c.pull.length; }, 0);
  var depMissed = pn.missed.filter(function(e){ return e.reason === "dependency"; }).length;
  var confPct = Math.round(pn.conf * 100) + "%";

  sum.innerHTML =
    stat(t("s5.stat.scope", { a: inScope, b: items.length }), t("s5.stat.scope.k")) +
    stat(t("s5.stat.req", { n: totalRaise, w: nw(totalRaise, "f.request") }), t("s5.stat.req.k", { n: urgent, w: nw(urgent, "f.must") })) +
    stat(t("s5.stat.miss", { n: pn.missed.length, w: nw(pn.missed.length, "f.item") }), t("s5.stat.miss.k", { n: depMissed, w: nw(depMissed, "f.blocked") })) +
    stat(t("s5.stat.cap", { pts: fmtN(r1(pn.capPts)) }), t("s5.stat.cap.k", { p: confPct }));

  $("plan-hint").textContent = t("s5.hint", { date: fmtDate(workingAdd(pn.targetDate, -1)), p: confPct });

  var html = "";
  pn.cols.forEach(function(c){
    var freeItems = c.pull.filter(function(e){ return !e.team; });
    var heldItems = c.pull.filter(function(e){ return e.team; });
    html += '<div class="col" style="--conf:' + (c.pull.length ? Math.round(freeItems.length / c.pull.length * 100) : 0) + '%">' +
      '<h3>' + t("sprintN", { n: c.sprint }) + '</h3>' +
      '<p class="pts">' + t("s5.colsub", { date: fmtDate(c.start), a: freeItems.length, b: c.pull.length }) + '</p>';

    html += '<div class="lane"><h4>' + t("s5.lane.safe") + '</h4>';
    if (!freeItems.length) html += '<p class="empty">' + t("s5.nofree") + '</p>';
    freeItems.forEach(function(e){
      var it = items[e.i];
      html += '<div class="pull"><span class="k">' + esc(it.key || t("nokey")) + '</span>' +
        '<span class="pts">' + (+it.points || 0) + ' ' + t("pt") + '</span></div>';
    });
    if (heldItems.length){
      html += '<h4 style="margin-top:14px">' + t("s5.lane.held") + '</h4>';
      heldItems.forEach(function(e){
        var it = items[e.i];
        html += '<div class="pull" style="border-style:dashed;flex-wrap:wrap"><span class="k">' + esc(it.key || t("nokey")) + '</span>' +
          '<span class="pts">' + esc(e.team) + ' · ' + (+it.points || 0) + ' ' + t("pt") + '</span>' +
          '<span class="pts" style="flex-basis:100%">' + t("s5.held.req", { n: e.raiseSprint || 1 }) + '</span></div>';
      });
    }
    html += '</div>';

    html += '<div class="lane"><h4>' + t("s5.lane.raise") + '</h4>';
    if (!c.raise.length) html += '<p class="empty">' + t("s5.noreq") + '</p>';
    c.raise.forEach(function(e){
      var it = items[e.i];
      html += '<div class="req">' +
        '<span class="k">' + esc(e.team) + ' &rarr; ' + esc(it.key || t("nokey")) + '</span>' +
        '<span class="d">' + (e.urgent ? t("s5.today") : t("s5.by.date2", { date: fmtDate(e.raiseBy) })) +
        ' · ' + t("s5.turn", { d: Math.ceil(e.wait), n: e.sprint }) + '</span></div>';
    });
    html += '</div></div>';
  });
  host.innerHTML = html;
  renderHandoff(pn);

  var lh = "";
  if (pn.missed.length){
    lh += '<div class="bucket"><h3>' + t("s5.miss.title") + '</h3>' +
          '<p style="font-size:13px;color:#fff;opacity:.75;margin-bottom:12px">' +
          t("s5.miss.sub", { p: confPct, n: pn.K, w: nw(pn.K, "f.sprint") }) + '</p>';
    pn.missed.forEach(function(e){
      var it = items[e.i];
      var why = e.reason === "dependency"
        ? t("s5.miss.dep", { team: esc(e.team), d: Math.ceil(e.wait) })
        : t("s5.miss.cap", { n: e.sprint });
      lh += '<div class="row-i"><span>' + esc(it.key || t("nokey")) + ' · ' + (+it.points || 0) + ' ' + t("pt") + '</span>' +
            '<span class="why">' + why + '</span></div>';
    });
    lh += '</div>';
  }
  lateHost.innerHTML = lh;
}


function renderHandoff(pn){
  var host = $("plan-handoff");
  var rows = [];
  pn.cols.forEach(function(c){
    c.pull.forEach(function(e){ if (e.team) rows.push(e); });
  });
  rows.sort(function(a, b){ return (a.raiseSprint || 1) - (b.raiseSprint || 1) || a.sprint - b.sprint; });

  var html = '<h3 style="margin-bottom:6px">' + t("s5.hand.title") + '</h3>' +
             '<p class="note" style="font-size:13px;margin-bottom:18px">' + t("s5.hand.note") + '</p>';
  if (!rows.length){
    host.innerHTML = '<div class="handoff">' + html + '<p class="empty">' + t("s5.hand.none") + '</p></div>';
    return;
  }

  var cols = 'grid-template-columns:repeat(' + pn.K + ',minmax(0,1fr))';
  html += '<div class="hgrid"><span></span><span class="hcells" style="' + cols + '">';
  for (var s = 1; s <= pn.K; s++) html += '<span class="hhead">' + t("sprintShort", { n: s }) + '</span>';
  html += '</span>';

  rows.forEach(function(e){
    var it = items[e.i];
    var from = e.raiseSprint || 1, to = e.sprint;
    html += '<span class="hlabel"><span class="k">' + esc(it.key || t("nokey")) + '</span>' +
            '<span class="t">' + esc(e.team) + '</span>' +
            '<span class="hsum">' + (from === to
              ? t("s5.hand.summary1", { a: t("sprintShort", { n: from }), d: Math.ceil(e.wait) })
              : t("s5.hand.summary", { a: t("sprintShort", { n: from }), b: t("sprintShort", { n: to }), d: Math.ceil(e.wait) })) +
            '</span></span>';
    html += '<span class="hcells" style="' + cols + '">';
    for (var c2 = 1; c2 <= pn.K; c2++){
      if (c2 === from && c2 === to) html += '<span class="hcell ask">' + t("s5.hand.same") + '</span>';
      else if (c2 === from) html += '<span class="hcell ask">' + t("s5.hand.ask") + '</span>';
      else if (c2 === to) html += '<span class="hcell work">' + t("s5.hand.start") + '</span>';
      else if (c2 > from && c2 < to) html += '<span class="hcell wait">' + t("s5.hand.wait") + '</span>';
      else html += '<span class="hcell"></span>';
    }
    html += '</span>';
  });
  html += '</div>';
  host.innerHTML = '<div class="handoff">' + html + '</div>';
}

/* ---------- import / export ---------- */

function normHeader(h){ return String(h).toLowerCase().replace(/[^a-z]/g, ""); }

function mapRow(row, headers){
  var it = blankItem();
  var labels = "";
  headers.forEach(function(h, idx){
    var v = row[idx];
    if (v === undefined || v === null) return;
    var n = normHeader(h);
    if (n === "key" || n === "issuekey" || n === "id" || n === "issueid") it.key = String(v).trim();
    else if (n === "summary" || n === "title" || n === "name" || n === "description") it.summary = String(v).trim();
    else if (n.indexOf("point") >= 0 || n === "estimate" || n === "estimation" || n === "sp" || n === "effort"){
      var f = parseFloat(String(v).replace(",", "."));
      if (isFinite(f)) it.points = f;
    }
    else if (n.indexOf("team") >= 0 || n.indexOf("dependson") >= 0 || n.indexOf("blockedby") >= 0 ||
             n === "dependency" || n === "dependencies") it.team = String(v).trim();
    else if (n === "labels" || n === "label" || n === "tags") labels = String(v).toLowerCase();
    else if (n === "state" || n === "dependencystate" || n === "depstate" || n === "status"){
      var sv = String(v).toLowerCase().trim();
      if (sv === "none" || sv === "waiting" || sv === "ready") it.state = sv;
    }
  });
  if (it.state === "none"){
    if (labels.indexOf("ready") >= 0 || labels.indexOf("resolved") >= 0) it.state = "ready";
    else if (labels.indexOf("dep") >= 0 || labels.indexOf("blocked") >= 0) it.state = "waiting";
  }
  if (it.state === "none" && it.team) it.state = "waiting";
  if (it.state !== "none"){
    if (!it.team) it.team = "Unassigned";
    ensureTeam(it.team, null);
    it.team = teams[teamIndex(it.team)].name;
  } else {
    it.team = "";
  }
  return it;
}

function importWorkbook(data, name){
  var msg = $("import-msg");
  try {
    var wb = XLSX.read(data, { type: "array" });
    var sheetNames = wb.SheetNames;
    var histName = null, backName = sheetNames[0];
    sheetNames.forEach(function(sn){
      var n = normHeader(sn);
      if (n.indexOf("throughput") >= 0 || n.indexOf("history") >= 0 || n.indexOf("velocity") >= 0) histName = sn;
      else if (n.indexOf("backlog") >= 0) backName = sn;
    });

    var rows = XLSX.utils.sheet_to_json(wb.Sheets[backName], { header: 1, blankrows: false });
    if (!rows.length) throw new Error(t("err.emptysheet"));
    var headers = rows[0].map(function(h){ return h == null ? "" : h; });
    var out = [];
    for (var r = 1; r < rows.length; r++){
      if (!rows[r] || !rows[r].length) continue;
      var it = mapRow(rows[r], headers);
      if (!it.key && !it.summary) continue;
      out.push(it);
    }
    if (!out.length) throw new Error(t("err.norows"));
    items = out;

    var extra = "";
    if (histName){
      var hrows = XLSX.utils.sheet_to_json(wb.Sheets[histName], { header: 1, blankrows: false });
      var lines = [];
      for (var q = 0; q < hrows.length; q++){
        var row = hrows[q] || [];
        var label = "", sizes = [];
        row.forEach(function(c, ci){
          var f = parseFloat(c);
          if (isFinite(f) && f > 0) sizes.push(f);
          else if (ci === 0 && c) label = String(c).trim();
        });
        if (sizes.length) lines.push((label ? label + ": " : "") + sizes.join(", "));
      }
      if (lines.length){
        $("p-throughput").value = lines.join("\n");
        extra = t("msg.import.extra", { n: lines.length, w: nw(lines.length, "f.sprint") });
      }
    }

    renderTeams(); renderTable(); runForecast();
    msg.innerHTML = '<div class="msg">' + t("msg.import", { n: out.length, w: nw(out.length, "f.item"), extra: extra, name: esc(name) }) + '</div>';
  } catch (err){
    msg.innerHTML = '<div class="msg bad">' + t("msg.import.bad", { err: esc(err.message) }) + '</div>';
  }
}

function readFile(file){
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e){ importWorkbook(new Uint8Array(e.target.result), file.name); };
  reader.onerror = function(){ $("import-msg").innerHTML = '<div class="msg bad">' + t("msg.read.bad") + '</div>'; };
  reader.readAsArrayBuffer(file);
}

        $("p-runs").value = d.parameters.runs || 3000;
        if (d.parameters.basis) $("p-basis").value = d.parameters.basis;
        if (d.parameters.backfill !== undefined) $("p-backfill").value = String(d.parameters.backfill);
        if (d.parameters.language && STR[d.parameters.language]){ LANG = d.parameters.language; applyLang(); }
      }
      if (Array.isArray(d.teams)) teams = d.teams.map(function(tm){
        return { name: tm.name || "", p85: +tm.p85 || 0 };
      });
      if (Array.isArray(d.items)) items = d.items.map(function(i){
        return { key:i.key||"", summary:i.summary||"", points:+i.points||0, team:i.team||"", state:i.state||"none" };
      });
      renderTeams(); renderTable(); runForecast();
      $("import-msg").innerHTML = '<div class="msg">' + t("msg.restored") + '</div>';
    } catch (err){
      $("import-msg").innerHTML = '<div class="msg bad">' + t("msg.json.bad") + '</div>';

  };
  reader.readAsText(file);
  e.target.value = "";
});

  var lines = [head.join(",")];
  items.forEach(function(it, i){
    var row = [it.key, '"' + String(it.summary).replace(/"/g, '""') + '"', it.points, it.team, it.state,
               f.placement[i] < 0 ? "beyond" : (f.placement[i] + 1)];
    for (var s2 = 0; s2 < p.horizon; s2++) row.push((f.cum[i][s2] || 0).toFixed(3));
    lines.push(row.join(","));
  });
  download(lines.join("\n"), "sprint-forecast.csv", "text/csv");
});

function download(text, name, mime){
  var blob = new Blob([text], { type: mime });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 0);
}
